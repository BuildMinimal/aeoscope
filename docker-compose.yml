services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeoscope
      POSTGRES_PASSWORD: aeoscope
      POSTGRES_DB: aeoscope
    ports:
      - "5432:5432"
    volumes:
      - aeoscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeoscope -d aeoscope"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Lets the app reach servers running on the host machine (LM Studio,
    # Ollama, ...) via host.docker.internal, including on Linux where the
    # name is not built in. Localhost-bound servers additionally need their
    # "serve on local network" option enabled on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://aeoscope:aeoscope@db:5432/aeoscope
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  aeoscope-pgdata:
